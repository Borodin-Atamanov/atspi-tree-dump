[project]
name = "atspi-tree-dump"
description = "Dump and filter Linux AT-SPI accessibility trees into compact JSON"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atspi_tree_dump"]

[tool.hatch.version]
# Single version source: src/atspi_tree_dump/__init__.py holds __version__; the
# bump_version module and the pre-commit hook update it before commits.
path = "src/atspi_tree_dump/__init__.py"
